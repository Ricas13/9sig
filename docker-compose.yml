services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: strategyos
      POSTGRES_PASSWORD: strategyos
      POSTGRES_DB: strategyos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - strategyos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategyos -d strategyos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - "3000:3000"
volumes:
  strategyos_db:
