services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: strategyos
      POSTGRES_PASSWORD: strategyos
      POSTGRES_DB: strategyos
    ports:
      - "5432:5432"
    volumes:
      - strategyos_db:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env.local
    ports:
      - "3000:3000"
volumes:
  strategyos_db:
