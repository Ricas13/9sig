name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strategyos
          POSTGRES_PASSWORD: strategyos
          POSTGRES_DB: strategyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strategyos -d strategyos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://strategyos:strategyos@127.0.0.1:5432/strategyos_test
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      CRON_SECRET: ci-only-cron-secret-long-enough
      EMAIL_PROVIDER: mock
      MARKET_DATA_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Migration validation
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for responsive smoke tests
        run: npx playwright install --with-deps chromium
      - name: Bootstrap visual baselines when absent
        id: visual_baselines
        shell: bash
        run: |
          if [ ! -d tests/e2e/visual.spec.ts-snapshots ]; then
            npx playwright test tests/e2e/visual.spec.ts --update-snapshots
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated visual baselines
        if: steps.visual_baselines.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
