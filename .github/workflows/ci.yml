name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strategyos
          POSTGRES_PASSWORD: strategyos
          POSTGRES_DB: strategyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strategyos -d strategyos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://strategyos:strategyos@127.0.0.1:5432/strategyos_test
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      EMAIL_PROVIDER: mock
      MARKET_DATA_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/multi-strategy-saas'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock npm dependency graph"
          git push
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
      - name: Migration validation
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for responsive smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
