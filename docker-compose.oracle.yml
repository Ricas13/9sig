# Oracle VM deployment: put HTTPS reverse proxy (Traefik/Caddy) in front of 127.0.0.1:3000.
# Use a private Docker network; PostgreSQL is never published on the VM.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strategyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: strategyos
    volumes:
      - strategyos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U strategyos -d strategyos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://strategyos:${POSTGRES_PASSWORD:?Required}@db:5432/strategyos
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]
  scheduler:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: [.env.production]
    command: ["/bin/sh","-ec","apk add --no-cache curl >/dev/null; while :; do curl --fail --silent --show-error --max-time 180 -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/actions || echo 'Cron cycle failed'; sleep 3600; done"]
    networks: [internal]
volumes:
  strategyos_db:
networks:
  internal:
    driver: bridge
